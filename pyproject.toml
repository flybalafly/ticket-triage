[project]
name = "ticket-triage"
version = "0.1.0"
description = "LangGraph-based triage agent for Shopify merchant support tickets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ticket_triage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
